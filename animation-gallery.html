function card(x){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="preview">${x.has_gif?`<img loading="lazy" src="${x.gif}" alt="${esc(x.title)} 动画预览">`:'<span class="no-gif">暂无 GIF 预览</span>'}<span class="number">${x.id} / 21</span></div><div class="body"><div class="titleline"><h2>${esc(x.title)}</h2><span class="tag">${x.has_gif?'GIF':'NO PREVIEW'}</span></div><p class="desc">${esc(x.trigger)}</p><div class="meta"><span>${esc(x.motion)}</span><span>${x.source_files.length} 个文件</span></div><button class="open">查看详情与源码 ↗</button></div>`;el.querySelector('button').onclick=()=>detail(x);el.querySelector('.preview').style.cursor='pointer';el.querySelector('.preview').onclick=()=>detail(x);return el}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase(),m=$('motion').value,p=$('preview').value;const filtered=items.filter(x=>(!q||[x.title,x.trigger,x.motion,x.slug,...x.keyframes].join(' ').toLowerCase().includes(q))&&(!m||x.motion===m)&&(!p||(p==='yes')===x.has_gif));grid.replaceChildren(...filtered.map(card));$('count').textContent=`显示 ${filtered.length} / ${items.length} 项`;$('empty').style.display=filtered.length?'none':'block'}
function detail(x){$('detailTitle').textContent=x.title;$('detailPreview').innerHTML=x.has_gif?`<img src="${x.gif}" alt="${esc(x.title)} 预览">`:'<div class="no-gif" style="padding:50px;text-align:center">暂无 GIF 预览</div>';$('detailTrigger').textContent=x.trigger;$('detailMotion').textContent=x.motion;$('detailKeys').textContent=x.keyframes.length?x.keyframes.join(' · '):'未发现独立 CSS keyframe 名称；主要逻辑位于交互 / 3D 帧循环';$('readme').textContent=x.readme||'暂无 README';$('fileCount').textContent=`(${x.source_files.length})`;$('files').replaceChildren(...x.source_files.map(f=>{const li=document.createElement('li');const a=document.createElement('a');a.href=f;a.target='_blank';a.rel='noreferrer';a.textContent=f.split('/').slice(-1)[0];const sm=document.createElement('small');sm.textContent=f;li.append(a,sm);return li}));const actions=[['打开 README',x.path+'/README.md'],['打开源码目录',x.path+'/Source/'],...(x.has_gif?[['单独查看 GIF',x.gif]]:[])];$('actions').replaceChildren(...actions.map(([t,u])=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noreferrer';a.textContent=t;return a}));$('modal').classList.add('show');document.body.style.overflow='hidden'}
function close(){ $('modal').classList.remove('show');document.body.style.overflow=''}$('close').onclick=close;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});['search','motion','preview'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
